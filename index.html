<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cold Call Practice</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f8a5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cold Call">

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
:root{--bg:#eef1f4;--ink:#16202b;--mute:#5d6b79;--card:#fff;--line:#d5dce3;--go:#1f8a5b;--end:#c2412d;--you:#dbe7f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;font-weight:800;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:0 0 6px}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin-bottom:16px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 18px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6aa5e0;outline-offset:2px}
.go{background:var(--go);color:#fff;width:100%}
.end{background:var(--end);color:#fff}
.ghost{background:#e6ebf0;color:var(--ink)}
#call{display:none;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:860px){#call{grid-template-columns:340px 1fr}#prop{position:sticky;top:16px}}
h1,p.sub,.warn{max-width:640px;margin-left:auto;margin-right:auto}
#setup,#hist,#fb,#again{max-width:640px;margin-left:auto;margin-right:auto}
.ph{height:120px;border-radius:10px;background:linear-gradient(135deg,#7fa88f,#4f7a63);display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:12px;font-weight:600}
.ph span{background:rgba(0,0,0,.45);border-radius:6px;padding:3px 8px}
.pst{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;margin:10px 0 4px;color:#fff;background:#0b6bcb}
.pst.red{background:#c2412d}.pst.gray{background:#5d6b79}.pst.amb{background:#b7791f}
.pp{font-size:30px;font-weight:800;line-height:1.1}
.pa{color:var(--mute);margin:2px 0 10px;font-size:14px}
.pstats{display:flex;gap:18px;margin-bottom:10px}
.pstats b{display:block;font-size:20px;font-weight:800}
.pstats span{font-size:12px;color:var(--mute)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.chip{background:#eef1f4;border-radius:8px;padding:7px 9px;font-size:13px}
.chip small{display:block;color:var(--mute);font-size:11px}
.pbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;line-height:1.45}
.pbox h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.pbox div{display:flex;justify-content:space-between;gap:8px}
.sim{font-size:11px;color:var(--mute);margin-top:8px}
#guide{display:none;position:fixed;inset:0;background:rgba(22,32,43,.55);z-index:50;overflow:auto;padding:16px}
#gsheet{max-width:720px;margin:0 auto;background:#fff;border-radius:14px;padding:18px;min-height:60vh}
#gsheet h2{margin:0;font-size:22px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-18px;background:#fff;padding:8px 0;z-index:2}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#f6f8fa}
summary{cursor:pointer;font-weight:700;padding:12px;list-style:none}
summary::after{content:"+";float:right;font-weight:800}
details[open] summary::after{content:"–"}
.gb{padding:0 12px 12px;line-height:1.55;font-size:15px}
.gb p{margin:6px 0}.gb ul{margin:6px 0;padding-left:20px}
.mh{margin:18px 0 4px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--go)}
#gsearch{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:4px 0 6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin:6px 0;font-weight:400}
.opt.ok{background:#d9f2e3;border-color:var(--go)}.opt.no{background:#f8d9d4;border-color:var(--end)}
.why{margin:6px 0 10px;font-size:14px;color:var(--mute)}
.q{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.q b{display:block;color:var(--end);font-size:14px}
.ar{direction:rtl;text-align:right;background:#e8f4ec;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
#lview{display:none;position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;color:#111}
.lt{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
.lt .brand{font-weight:800;font-size:22px;color:#0041d9}
.lb{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;z-index:3}
.lb .tip{flex:1;font-size:13px;color:var(--mute)}
.lw{max-width:1000px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:860px){.lw{grid-template-columns:1fr 300px}}
.hero{height:200px;border-radius:12px;background:linear-gradient(180deg,#9fc3a7,#6d9a56 55%,#4f7a3a);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:#3f6a2e}
.hero i{position:absolute;left:14px;bottom:14px;z-index:2;background:#111;color:#fff;font-style:normal;font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px}
.big{font-size:38px;font-weight:800;line-height:1.1}
.row3{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.st3{display:flex;gap:22px}.st3 b{font-size:28px;font-weight:800;display:block;line-height:1}.st3 span{font-size:14px;font-weight:700}
.refi{background:#e3efff;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px;display:inline-block}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.g3 div{background:#eeeff1;border-radius:8px;padding:12px;font-size:14px;font-weight:600}
.sec{border-top:1px solid #ddd;margin-top:20px;padding-top:14px}
.sec h3{font-size:22px;margin:0 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:#666;font-weight:600;padding:6px 4px;border-bottom:1px solid #ddd}
.tbl td{padding:8px 4px;border-bottom:1px solid #eee}
.tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:5px;padding:2px 7px;background:#0b6bcb;margin-bottom:6px}
.tag.red{background:#c2412d}.tag.gray{background:#5d6b79}.tag.amb{background:#b7791f}
.side{border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;line-height:1.45;align-self:start}
.side .cta{display:block;text-align:center;background:#0041d9;color:#fff;border-radius:8px;padding:12px;font-weight:700;margin-top:10px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.vals div{background:#eeeff1;border-radius:8px;padding:12px;font-size:13px}
.vals b{display:block;font-size:20px;margin-top:2px}
.fl{columns:2;column-gap:20px;font-size:14px;line-height:1.7;margin:0;padding-left:18px}
.leadbox{background:#fff8e1;border:1px solid #e6cf85;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
#ptoggle{display:none;width:100%;margin-bottom:8px}
@media(max-width:859px){#ptoggle{display:block}#pbody.hide{display:none}}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
#who{font-weight:800;font-size:20px}
#status{color:var(--mute);font-size:14px}
#timer{font-variant-numeric:tabular-nums;color:var(--mute)}
#log{height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:85%;padding:10px 12px;border-radius:12px;line-height:1.4}
.m.c{background:#f1f3f5;align-self:flex-start;border:1px solid var(--line)}
.m.u{background:var(--you);align-self:flex-end}
.row{display:flex;gap:8px;margin-top:12px}
input[type=text]{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aab4be;margin-right:6px}
.dot.on{background:var(--go);animation:p 1s infinite}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
@keyframes p{50%{opacity:.35}}
#fb{display:none;white-space:pre-wrap;line-height:1.5;margin-top:16px}
.install{display:none;width:100%;margin-top:10px;background:#16202b;color:#fff}
.hint{display:none;margin-top:10px;color:var(--mute);font-size:14px;line-height:1.4}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#f6f8fa;border:1px solid var(--line);margin-bottom:8px;gap:8px}
.item small{display:block;color:var(--mute);font-weight:400}
.score{font-weight:800;font-size:18px;white-space:nowrap}
#hist{display:none}
.tr{display:flex;flex-direction:column;gap:8px;margin-top:12px}
h3{margin:16px 0 6px;font-size:16px}
.txt{white-space:pre-wrap;line-height:1.5}
.warn{background:#fff3cd;border:1px solid #e6cf85;padding:10px;border-radius:10px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<main>
  <h1>Cold Call Practice</h1>
  <p class="sub">A simulated US/Canada homeowner picks up. Speak English into your mic.</p>
  <div class="warn" id="warn">Voice input needs Google Chrome. You can still type your replies.</div>

  <section class="card" id="setup">
    <label for="persona">Who picks up?</label>
    <select id="persona">
      <option value="fsbo">FSBO owner (selling alone)</option>
      <option value="expired">Expired listing</option>
      <option value="busy">Busy, wants to hang up</option>
      <option value="hasagent">Already has an agent</option>
      <option value="hesitant">Hesitant seller</option>
      <option value="notint">"Not interested"</option>
      <option value="investor">Investor / landlord</option>
    </select>
    <label for="level">Difficulty</label>
    <select id="level">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="go" id="start">Start call</button>
    <a class="ghost" href="/course.html" style="display:block;text-align:center;text-decoration:none;border-radius:10px;padding:13px 18px;font-weight:600;margin-top:10px;background:#e6ebf0;color:var(--ink)">Course: start from zero</a>
    <button class="ghost" id="guideOpen" style="width:100%;margin-top:10px">Guide: learn cold calling</button>
    <button class="ghost" id="histOpen" style="width:100%;margin-top:10px">History</button>
    <button class="install" id="install">Install as app</button>
    <div class="hint" id="iosHint">To install on iPhone: tap Share, then "Add to Home Screen".</div>
  </section>

  <section id="call">
    <aside class="card" id="prop">
      <button class="ghost" id="ptoggle">Hide / show property info</button>
      <div id="pbody"></div>
    </aside>
    <div class="card" id="callpane">
      <div class="bar">
        <div><div id="who"></div><div id="status"><span class="dot" id="dot"></span><span id="st">Connecting</span></div></div>
        <div id="timer">00:00</div>
      </div>
      <div id="log" aria-live="polite"></div>
      <div class="row">
        <input type="text" id="txt" placeholder="Type instead of speaking" autocomplete="off">
        <button class="ghost" id="send">Send</button>
      </div>
      <div class="row">
        <button class="ghost" id="mic">Pause mic</button>
        <label class="sub" style="display:flex;align-items:center;gap:6px;margin:0">Wait <select id="wait" style="padding:8px;border-radius:8px;border:1px solid var(--line)"><option value="1500">1.5s</option><option value="2500">2.5s</option><option value="4000">4s</option><option value="6000">6s</option></select></label>
        <button class="ghost" id="guideOpen2">Guide</button>
        <button class="ghost" id="listOpen">Listing</button>
        <button class="end" id="hang" style="margin-left:auto">End call</button>
      </div>
    </div>
  </section>

  <section class="card" id="fb"></section>
  <div class="row" id="again" style="display:none">
    <button class="ghost" id="retry" style="display:none">Retry feedback</button>
    <button class="ghost" id="histOpen2">History</button>
    <button class="go" style="flex:1" onclick="location.reload()">New call</button>
  </div>

  <section class="card" id="hist">
    <div class="bar">
      <button class="ghost" id="hBack">Back</button>
      <button class="ghost" id="hClear">Clear all</button>
    </div>
    <div id="hlist"></div>
    <div id="hdet" style="display:none"></div>
  </section>
</main>
<div id="lview"></div>
<div id="guide" role="dialog" aria-modal="true" aria-label="Cold calling guide"><div id="gsheet"></div></div>
<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("warn").style.display = "block";

const NAMES = {fsbo:"Mike",expired:"Linda",busy:"Dave",hasagent:"Karen",hesitant:"Priya",notint:"Tom",investor:"Carlos"};
let prop, msgs = [], persona, level, rec, micOn = true, speaking = false, busy = false, ended = false, t0, tick, voice;

function pickVoice(){
  const v = speechSynthesis.getVoices().filter(x => /en-(US|CA)/i.test(x.lang));
  voice = v.find(x => /google|natural|samantha|aria|jenny/i.test(x.name)) || v[0];
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function add(text, cls){
  const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}
function status(s, on){ $("st").textContent = s; $("dot").classList.toggle("on", !!on); }

// ---- Simulated property listing (fictional data, for practice only) ----
const HOMES = [
  {addr:"7929 E Shearer Rd", city:"Indianapolis", st:"IN", zip:"46219", beds:3, baths:1.5, sqft:1537, yr:1957, lot:"0.28 acres", zest:155000, rent:1582, type:"Single Family"},
  {addr:"412 Maple Ridge Dr", city:"Columbus", st:"OH", zip:"43229", beds:4, baths:2.5, sqft:2105, yr:1994, lot:"0.21 acres", zest:318000, rent:2350, type:"Single Family"},
  {addr:"1806 Oakwood Ln", city:"Charlotte", st:"NC", zip:"28208", beds:3, baths:2, sqft:1480, yr:1968, lot:"0.19 acres", zest:289000, rent:2100, type:"Single Family"},
  {addr:"93 Birch Hollow Ct", city:"Tampa", st:"FL", zip:"33610", beds:3, baths:2, sqft:1620, yr:1986, lot:"0.17 acres", zest:342000, rent:2450, type:"Single Family"},
  {addr:"2210 Prairie View Rd", city:"Kansas City", st:"MO", zip:"64134", beds:2, baths:1, sqft:1120, yr:1952, lot:"0.24 acres", zest:164000, rent:1380, type:"Single Family"},
  {addr:"5517 Lakeshore Ave", city:"Cleveland", st:"OH", zip:"44102", beds:4, baths:2, sqft:1890, yr:1929, lot:"0.12 acres", zest:196000, rent:1750, type:"Multi-family"},
  {addr:"640 Cedar Crest Way", city:"Phoenix", st:"AZ", zip:"85017", beds:4, baths:2, sqft:1760, yr:1976, lot:"0.20 acres", zest:402000, rent:2650, type:"Single Family"},
  {addr:"88 Willow Bend", city:"Hamilton", st:"ON", zip:"L8K 4B2", beds:3, baths:1.5, sqft:1350, yr:1972, lot:"0.11 acres", zest:610000, rent:2900, type:"Single Family"},
];
const LAST = ["Johnson","Miller","Davis","Wilson","Anderson","Taylor","Moore","Clark","Walker","Hall"];
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const r1000 = n => Math.round(n/1000)*1000;
const pick = a => a[Math.floor(Math.random()*a.length)];
const ago = d => new Date(Date.now() - d*864e5).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

const STATES = [
 {st:"IN",c:["Indianapolis","Fort Wayne","Evansville"],tz:"America/Indiana/Indianapolis",pp:105,z:"46",ac:"317"},
 {st:"OH",c:["Columbus","Cleveland","Cincinnati"],tz:"America/New_York",pp:135,z:"43",ac:"614"},
 {st:"NC",c:["Charlotte","Raleigh","Greensboro"],tz:"America/New_York",pp:190,z:"28",ac:"704"},
 {st:"FL",c:["Tampa","Orlando","Jacksonville"],tz:"America/New_York",pp:230,z:"33",ac:"813"},
 {st:"TX",c:["Houston","Dallas","San Antonio"],tz:"America/Chicago",pp:165,z:"77",ac:"713"},
 {st:"AZ",c:["Phoenix","Mesa","Tucson"],tz:"America/Phoenix",pp:255,z:"85",ac:"602"},
 {st:"MO",c:["Kansas City","St. Louis"],tz:"America/Chicago",pp:120,z:"64",ac:"816"},
 {st:"GA",c:["Atlanta","Savannah","Augusta"],tz:"America/New_York",pp:185,z:"30",ac:"404"},
 {st:"CA",c:["Fresno","Sacramento","San Diego"],tz:"America/Los_Angeles",pp:420,z:"95",ac:"559"},
 {st:"ON",c:["Hamilton","London","Ottawa"],tz:"America/Toronto",pp:440,z:"",ac:"905"},
];
const STREETS = ["Maple Ridge Dr","Oakwood Ln","Cedar Crest Way","Birch Hollow Ct","Prairie View Rd","Lakeshore Ave","Willow Bend","Sunset Blvd","Pine St","Elm St","Highland Ave","Meadow Ln","River Rd","Church St","Park Ave","Walnut St","Hillcrest Dr","Chestnut St","Shearer Rd","Orchard Way"];
const rr = (a,b) => a + Math.random()*(b-a), ri = (a,b) => Math.floor(rr(a,b+1));
function genHome(){
  const S = pick(STATES), t = Math.random(); 
  const type = t < .70 ? "Single Family" : t < .82 ? "Townhouse" : t < .90 ? "Condo" : "Multi-family";
  const condo = type === "Condo", sqft = Math.round((condo ? rr(650,1300) : type === "Multi-family" ? rr(1700,3000) : rr(1000,2300))/10)*10;
  const beds = condo ? ri(1,2) : sqft < 1300 ? ri(2,3) : sqft < 2000 ? ri(3,4) : ri(4,5);
  const yr = ri(1925,2018), age = (2026-yr);
  const zest = r1000(sqft * S.pp * .8 * rr(.85,1.2) * (age > 70 ? .92 : age < 15 ? 1.12 : 1));
  const zip = S.st === "ON" ? pick("KLMN") + ri(1,9) + pick("ABCEG") + " " + ri(1,9) + pick("ABCEG") + ri(1,9) : S.z + String(ri(100,999));
  return {addr: ri(20,9899) + " " + (Math.random()<.35 ? pick(["E","W","N","S"]) + " " : "") + pick(STREETS), city: pick(S.c), st: S.st, zip, tz: S.tz, ac: S.ac,
    beds, baths: Math.max(1, beds - ri(0,1) - (Math.random()<.5 ? .5 : 0)), sqft, yr, lot: condo ? "—" : (rr(.08,.45)).toFixed(2) + " acres", zest, rent: Math.round(zest*rr(.0065,.0085)/10)*10, type};
}
const COACH = {
 fsbo:{goal:"Book a short meeting or get permission to send a free CMA and buyer-agent info.",open:"Hi Mike, this is Yasser with ABC Realty. I saw your home is for sale by owner. Did I catch you at a bad time?",qs:["How many showings and calls have you had so far?","What's your plan if it doesn't sell in the next 30 days?","What matters most to you: price, speed, or less hassle?"],watch:"Don't attack FSBO. Don't ask for the listing on the first call."},
 expired:{goal:"Listen first, then offer a free pricing review and a different marketing plan.",open:"Hi Linda, I saw your home came off the market. I'm not here to pitch. Do you still want to sell?",qs:["What feedback did you get from showings?","What do you think held it back?","What would you want done differently this time?"],watch:"Never badmouth the old agent. Don't promise a higher price."},
 busy:{goal:"Earn 20 seconds, then book a better time to call.",open:"Hi Dave, Yasser with ABC Realty. I know you're busy. Can I take 20 seconds to tell you why I called?",qs:["When is a better 5 minutes today or tomorrow?"],watch:"Be short. If he says later, set a time and say thanks."},
 hasagent:{goal:"Stay respectful, ask for a second opinion, and keep the door open.",open:"Hi Karen, Yasser with ABC Realty. I work in your area. Are you thinking about selling anytime soon?",qs:["Are you happy with how things are going with your agent?","If you ever sell, what would make you consider a second opinion?"],watch:"Don't push. Accept 'I'm covered', then ask one soft question."},
 hesitant:{goal:"Reduce uncertainty with facts and book a no-pressure market review.",open:"Hi Priya, Yasser with ABC Realty. Do you have a minute? I'm helping homeowners understand their options.",qs:["What worries you most about selling now?","What would need to be true for you to consider it?","Would a quick value review help you decide?"],watch:"Answer her questions with data (comps, equity), not pressure."},
 notint:{goal:"Create curiosity with value, then ask permission for a short follow-up.",open:"Hi Tom, Yasser with ABC Realty. I'm not calling to list your home. I noticed values on your street went up. Got a quick minute?",qs:["Out of curiosity, have you checked what your home is worth now?","If the number surprised you, would you want to know?"],watch:"Don't argue with 'not interested'. Acknowledge, then ask one question."},
 investor:{goal:"Talk numbers fast and offer a net proceeds estimate.",open:"Hi Carlos, Yasser with ABC Realty. Values around your rental are up. Would you sell for the right number?",qs:["What return are you getting on this property now?","What net number would make you sell?","What's your timeline and tenant situation?"],watch:"Skip small talk. Use the value, rent, and equity from the page."},
};
const NOTES = ["No answer","Voicemail left","Said call back next week","Hung up quickly","Asked to send info by email","Gatekeeper answered"];
function localTime(h){
  const d = new Date(), hr = +d.toLocaleString("en-US",{timeZone:h.tz,hour:"numeric",hour12:false}) % 24;
  return {txt: d.toLocaleTimeString("en-US",{timeZone:h.tz,hour:"numeric",minute:"2-digit"}), ok: hr >= 8 && hr < 21};
}

function makeProp(p){
  const h = genHome(), z = h.zest;
  h.owner = NAMES[p] + " " + pick(LAST);
  h.ppsf = money(z/h.sqft) + "/sqft"; h.tax = money(z*0.011) + "/yr";
  h.hist = []; h.notes = ""; h.status = "Off market"; h.cls = "gray"; h.price = null; h.dom = null;
  if (p === "fsbo") { h.status = "For sale by owner"; h.cls = ""; h.price = r1000(z*1.08); h.dom = 34 + Math.floor(Math.random()*40);
    h.hist = [[ago(h.dom), "Listed for sale (FSBO)", money(h.price)]];
    h.notes = "Listed by owner on a FSBO site. Phone number from the listing. Owner wants to avoid commission."; }
  else if (p === "expired") { h.status = "Listing expired"; h.cls = "red"; const l = r1000(z*1.12); h.price = r1000(z*1.04); h.dom = 90;
    h.hist = [[ago(3), "Listing removed (expired)", "—"], [ago(40), "Price change", money(h.price)], [ago(93), "Listed for sale", money(l)]];
    h.notes = "Expired MLS listing, 90 days, one price drop. Previous agent did not sell."; }
  else if (p === "investor") { h.status = "Off market · Rental"; h.cls = "amb"; h.hist = [[ago(1500), "Sold", money(z*0.55)]];
    h.notes = "Rental property. Equity is high. Value up over the last 3 years."; }
  else if (p === "busy") { h.hist = [[ago(2400), "Sold", money(z*0.6)]]; h.notes = "Owner-occupied. Contractor. Hard to reach during the day."; }
  else if (p === "hasagent") { h.hist = [[ago(3100), "Sold", money(z*0.5)]]; h.notes = "Owner-occupied 8+ years. Possible long-term seller. May already work with an agent."; }
  else if (p === "hesitant") { h.hist = [[ago(2900), "Sold", money(z*0.55)]]; h.notes = "Owner-occupied. Asked about the market on a past online form. Unsure about timing."; }
  else { h.hist = [[ago(4300), "Sold", money(z*0.42)]]; h.notes = "Owner-occupied 10+ years. Lots of equity. No known plans to sell."; }
  h.equity = money(z*0.7);
  return extendProp(h, p);
}
function renderProp(h){

  b.appendChild(el("div","pp", money(h.price || h.zest)));
  b.appendChild(el("div","pa", h.addr + ", " + h.city + ", " + h.st + " " + h.zip));
  const s = el("div","pstats");
  [[h.beds,"beds"],[h.baths,"baths"],[h.sqft.toLocaleString("en-US"),"sqft"]].forEach(([v,l]) => { const d = el("div"); d.appendChild(el("b","",String(v))); d.appendChild(el("span","",l)); s.appendChild(d); });
  b.appendChild(s);
  const c = el("div","chips");
  [["Type",h.type],["Built",String(h.yr)],["Lot",h.lot],["Price/sqft",h.ppsf],["Est. value",money(h.zest)],["Est. rent",money(h.rent)+"/mo"]].forEach(([k,v]) => { const d = el("div","chip",v); d.insertBefore(el("small","",k), d.firstChild); c.appendChild(d); });
  b.appendChild(c);
  const o = el("div","pbox"); o.appendChild(el("h4","","Owner (lead info)"));
  [["Name",h.owner],["Phone",h.phone],["Local time",localTime(h).txt],["Est. equity",h.equity],["Mortgage",h.balance ? money(h.balance) + " @ " + h.rate + "%" : "Paid off"],["Est. taxes",h.tax]].forEach(([k,v]) => { const d = el("div"); d.appendChild(el("span","",k)); d.appendChild(el("b","",v)); o.appendChild(d); });
  b.appendChild(o);
  const hs = el("div","pbox"); hs.appendChild(el("h4","","Price & listing history"));
  h.hist.forEach(x => { const d = el("div"); d.appendChild(el("span","",x[0] + " · " + x[1])); d.appendChild(el("b","",x[2])); hs.appendChild(d); });
  if (h.dom) { const d = el("div"); d.appendChild(el("span","","Days on market")); d.appendChild(el("b","",String(h.dom))); hs.appendChild(d); }
  b.appendChild(hs);
  const n = el("div","pbox"); n.appendChild(el("h4","","Your notes")); n.appendChild(el("div","",h.notes)); b.appendChild(n);
  b.appendChild(el("div","sim","Fictional data for practice. Not a real listing."));
}
function propLine(h){
  return `${h.addr}, ${h.city} ${h.st}. ${h.beds} bd, ${h.baths} ba, ${h.sqft} sqft, built ${h.yr}, ${h.type}. Est. value ${money(h.zest)}, est. rent ${money(h.rent)}/mo. Status: ${h.status}` + (h.price ? `, asking ${money(h.price)}` : "") + (h.dom ? `, ${h.dom} days on market` : "") + `. Owner name: ${h.owner}. Mortgage balance about ${money(h.balance)} at ${h.rate}%, owned about ${2026 - h.loanYr} years.`;
}

const GUIDE = [
 {t:"1. The goal of a cold call", ar:"الهدف مش البيع في المكالمة. الهدف ميعاد (appointment) أو خطوة جاية.", html:`<p>You are not selling a house on the phone. You are earning the next step: a listing appointment, a free CMA (comparative market analysis), or permission to call back.</p><ul><li>Be calm, short and curious.</li><li>Ask more than you talk (aim for 60% listening).</li><li>Every call ends with a clear next step and a time.</li></ul>`},
 {t:"2. Call structure (5 steps)", ar:"افتتاحية قصيرة، استأذن، اسأل، رد على الاعتراض، اقفل بميعاد.", html:`<ul><li><b>Opener (10 sec):</b> name, company, reason.</li><li><b>Permission:</b> "Did I catch you at a bad time?"</li><li><b>Discover:</b> timeline, motivation, price expectations.</li><li><b>Handle objections:</b> Acknowledge, Ask, Offer.</li><li><b>Close for a step:</b> "Would Tuesday at 4 or Wednesday at 10 work better?"</li></ul><div class="q"><b>Example opener</b>"Hi Mike, this is Yasser with ABC Realty. I saw your home on Maple Dr is for sale by owner. Did I catch you at a bad time?"</div>`},
 {t:"3. Openers by lead type", ar:"كل نوع lead له افتتاحية مختلفة.", html:`<div class="q"><b>FSBO</b>"I'm not calling to list your home. I help FSBO sellers with buyer-agent commissions and paperwork. How's the response been so far?"</div><div class="q"><b>Expired</b>"I saw your listing came off the market. I'm not here to pitch. I'm curious what you'd want done differently if you sold it again."</div><div class="q"><b>Investor / absentee</b>"Values around your rental are up. Would you consider selling if the net numbers made sense?"</div><div class="q"><b>Past client / sphere</b>"Hi Karen, it's Yasser. Just checking in. How's the house treating you? Any plans for this year?"</div>`},
 {t:"4. Objection handling (Acknowledge, Ask, Offer)", ar:"ماتجادلش. وافقه، اسأل سؤال، واعرض خطوة صغيرة.", html:`<div class="q"><b>"Not interested."</b>"Totally fair. Just so I don't waste your time, is it that you're not planning to sell, or the timing isn't right?"</div><div class="q"><b>"I already have an agent."</b>"Great, glad you're covered. If things ever change, are you open to a second opinion on value, no strings?"</div><div class="q"><b>"How did you get my number?"</b>"Your listing / public records. I'll take you off my list if you prefer. Before I do, can I ask one quick question?"</div><div class="q"><b>"What's your commission?"</b>"It's negotiable and depends on the plan. Instead of a number, can I show you what you'd net after costs? That's what matters."</div><div class="q"><b>"I'll think about it."</b>"Of course. What specifically would you want to think over? Maybe I can help with that now."</div><div class="q"><b>"I'm busy."</b>"No problem. When's a better 5 minutes today or tomorrow?"</div><div class="q"><b>"I want to sell it myself / save the commission."</b>"Makes sense. What would a buyer's agent fee do to your net? Let me send you a quick comparison."</div>`},
 {t:"5. Questions that open people up", ar:"الأسئلة الصح بتخلي العميل يتكلم.", html:`<ul><li>"What's your ideal timeline?"</li><li>"What's most important to you in a sale?"</li><li>"If it sold at your price, where would you move?"</li><li>"What happened with the last listing?" (expired)</li><li>"What's the one thing that worries you about selling?"</li></ul>`},
 {t:"6. Closing for the appointment", ar:"اعرض اختيارين محددين، مش سؤال مفتوح.", html:`<ul><li>Offer two time options, never "whenever you like".</li><li>Give value: "I'll bring recent comps and a net sheet."</li><li>Confirm: repeat day, time, address. Send a text or email.</li></ul><div class="q"><b>Close</b>"Based on what you told me, it makes sense to look at the numbers together. I have Tuesday 4:00 or Wednesday 10:00. Which is better?"</div>`},
 {t:"7. Tone and delivery", ar:"الصوت أهم من الكلمات.", html:`<ul><li>Smile, stand up, slow down.</li><li>Keep sentences short. Pause after questions.</li><li>Avoid "just calling to...", "um", "to be honest".</li><li>Don't sound scripted. Know the idea, not the words.</li></ul>`},
 {t:"8. Legal basics (USA / Canada)", ar:"مش نصيحة قانونية. تأكد من مختص قبل أي شغل حقيقي.", html:`<ul><li>US: National Do Not Call Registry and TCPA. Scrub lists.</li><li>Call only between 8 AM and 9 PM in the person's local time.</li><li>Autodialers and texts generally need consent.</li><li>Canada: National DNCL and CRTC rules.</li><li>If someone says stop, mark Do Not Call immediately.</li><li>Working from abroad: the US agent or brokerage is responsible for compliance.</li></ul>`},
 {t:"9. Daily practice and metrics", ar:"التدريب اليومي والأرقام.", html:`<ul><li>10 to 15 practice calls daily, one focus each session (opener, one objection, closing).</li><li>Review History: read your feedback and rewrite weak lines.</li><li>Track: dials per hour, contacts, appointments per 100 dials.</li><li>Typical real-life rates are low (a few appointments per 100 dials), so volume and consistency win.</li></ul>`},
 {t:"10. Vocabulary", ar:"مصطلحات لازم تعرفها.", html:`<ul><li><b>FSBO:</b> For Sale By Owner.</li><li><b>Expired:</b> listing ended without selling.</li><li><b>CMA:</b> comparative market analysis (comps).</li><li><b>DOM:</b> days on market.</li><li><b>MLS:</b> Multiple Listing Service.</li><li><b>Equity:</b> value minus mortgage owed.</li><li><b>Net sheet:</b> what the seller takes home.</li><li><b>Absentee owner:</b> owner lives elsewhere.</li><li><b>ISA:</b> inside sales agent (makes the calls, books appointments).</li><li><b>CRM:</b> software to track leads and follow-ups.</li></ul>`},

 {m:"Preparation", t:"Before you dial: research and setup", ar:"التحضير قبل المكالمة بيفرق أكتر من الـ script.", html:`<ul><li>Read the property facts first: price, days on market, history, equity (use the panel in the app).</li><li>Write 2 or 3 personal facts you can mention (street, neighborhood, listing date).</li><li>Prepare your goal for the call: one appointment, or one useful piece of info.</li><li>Use a quiet room, a headset, water, and a smile mirror or note: "Smile".</li><li>Keep a CRM or a simple sheet: name, phone, result, follow-up date, notes.</li><li>Do a time block (60 to 90 minutes) with no interruptions.</li></ul>`},
 {m:"Preparation", t:"Best times to call", ar:"أوقات الاتصال بتفرق في نسبة الرد.", html:`<ul><li>Common advice: 9 to 11 AM and 4:30 to 7 PM local time, on weekdays.</li><li>FSBO and expired leads: early morning and early evening often work well.</li><li>Always respect local time zones: 8 AM to 9 PM only.</li><li>Test and track your own contact rate by hour. Your data beats general advice.</li></ul>`},

 {m:"Real estate knowledge", t:"Pricing, comps, and net proceeds", ar:"السعر والـ comps والـ net هم أساس الإقناع.", html:`<ul><li><b>Comps:</b> recent nearby sales of similar homes. Usually last 3 to 6 months, within about a mile.</li><li><b>Overpricing</b> is the main reason listings expire: more days on market, then price cuts.</li><li><b>Net proceeds</b> = sale price minus mortgage payoff, agent fees, closing costs, repairs, and credits.</li><li>Closing costs for sellers are often a few percent of the price, plus commission. Say "it depends" and offer to calculate exactly.</li><li>Never promise a price. Say: "Let me look at the comps and give you a real range."</li></ul>`},

 {m:"Lead types in depth", t:"Investors and absentee owners", ar:"الأرقام هي اللغة هنا.", html:`<ul><li>Talk numbers: price, net, timeline, 1031 exchange (ask a tax pro), tenant situation.</li><li>Ask: "Are you happy with the return on this property?", "Would you sell for the right number?"</li><li>Offer: a short valuation and an off-market buyer list if you have one.</li><li>Keep it quick and respectful. Investors dislike long pitches.</li></ul>`},
 {m:"Lead types in depth", t:"Busy people, gatekeepers, and spouses", ar:"إزاي تتعامل مع مشغول ولازم أكلم زوجتي.", html:`<div class="q"><b>"I'm busy."</b>"Of course. Would 5 minutes tomorrow at 6 PM be okay, or is another time better?"</div><div class="q"><b>"I need to talk to my wife / husband."</b>"Absolutely. Would it help to have a quick call with both of you? What time works for both?"</div><div class="q"><b>Someone else answers</b>"Hi, this is Yasser. Is [name] available? I'm calling about the property on [street]."</div><div class="q"><b>Wrong number</b>"Sorry about that. Thanks, have a great day." Mark it in your CRM.</div>`},
 {m:"Communication skills", t:"Rapport and active listening", ar:"الاستماع الذكي بيخلي العميل يثق فيك.", html:`<ul><li><b>Mirroring:</b> repeat the last 2 or 3 words as a question. ("...not interested right now?")</li><li><b>Labeling:</b> "It sounds like you're frustrated with the last agent."</li><li><b>Summarize:</b> "So you want to sell by spring and net at least X. Did I get that right?"</li><li><b>Silence:</b> ask, then stop talking.</li><li>Match their pace: slow with calm people, quick with impatient ones.</li><li>Good book: Chris Voss, "Never Split the Difference".</li></ul>`},

 {m:"Follow-up", t:"Voicemail and follow-up cadence", ar:"أغلب الصفقات بتيجي من المتابعة.", html:`<div class="q"><b>Voicemail (under 20 sec)</b>"Hi Mike, this is Yasser with ABC Realty about your home on Maple Dr. I have a quick idea about your sale. I'll try you again tomorrow, or call me at 555-0100."</div><ul><li>Many prospects need many touches (often 8 or more) over several weeks.</li><li>Mix: call, short text (if allowed), email, mail.</li><li>Each touch should give value: new comps, a market update, a price change nearby.</li><li>Log the date and the next action every time.</li></ul>`},

function extendProp(h, p){
  const z = h.zest, rnd = (a,b) => a + Math.random()*(b-a);
  h.chg = Math.round(rnd(-2,9)*10)/10;

  const o = JSON.parse(txt);
  if (!NAMES[o.p] || !LEVELS[o.l]) throw new Error("bad data");
  return {id:0, ts:o.t, persona:o.p, level:o.l, dur:o.d, prop:o.pr, feedback:o.f, msgs:o.m.map(x => ({role: x[0] === "u" ? "user" : "model", text: String(x[1])}))};

  const fb = el("div", "txt", rec.feedback || "No feedback saved for this call."); d.appendChild(fb);
  if (!rec.feedback && !shared) {
    const r = el("button", "ghost", "Get feedback"); r.style.marginTop = "8px";
    r.onclick = async () => {
      fb.textContent = "Analyzing your call…"; r.disabled = true;
      try { rec.feedback = await api({mode:"feedback", persona: rec.persona, level: rec.level, property: rec.prop, messages: rec.msgs}); upsert(rec); renderDetail(rec.id); }
      catch (e) { fb.textContent = "Couldn't get feedback: " + e.message; r.disabled = false; }
    };
    d.appendChild(r);
  }
  d.appendChild(el("h3", "", "Transcript"));
  const tr = el("div", "tr");
  rec.msgs.filter(m => !m.hidden).forEach(m => tr.appendChild(el("div", "m " + (m.role === "user" ? "u" : "c"), m.text)));
  d.appendChild(tr);
  if (shared) return;
  const del = el("button", "end", "Delete this call"); del.style.marginTop = "16px";
  del.onclick = () => { if (confirm("Delete this call?")) { saveH(loadH().filter(x => x.id !== rec.id)); renderList(); } };
  d.appendChild(del);
}
openShared();
$("histOpen").onclick = showHistory;
$("histOpen2").onclick = showHistory;
$("hBack").onclick = () => location.reload();
$("hClear").onclick = () => { if (confirm("Delete all saved calls?")) { saveH([]); renderList(); } };

// ---- PWA: service worker + install button ----
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
let deferredPrompt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (!standalone) $("install").style.display = "block";
});
$("install").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; $("install").style.display = "none";
};
window.addEventListener("appinstalled", () => { $("install").style.display = "none"; });
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $("iosHint").style.display = "block";
</script>
</body>

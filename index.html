<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cold Call Practice</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f8a5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cold Call">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--ink:#16202b;--mute:#5d6b79;--card:#fff;--line:#d5dce3;--go:#1f8a5b;--end:#c2412d;--you:#dbe7f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;font-weight:800;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:0 0 6px}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin-bottom:16px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 18px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6aa5e0;outline-offset:2px}
.go{background:var(--go);color:#fff;width:100%}
.end{background:var(--end);color:#fff}
.ghost{background:#e6ebf0;color:var(--ink)}
#call{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
#who{font-weight:800;font-size:20px}
#status{color:var(--mute);font-size:14px}
#timer{font-variant-numeric:tabular-nums;color:var(--mute)}
#log{height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:85%;padding:10px 12px;border-radius:12px;line-height:1.4}
.m.c{background:#f1f3f5;align-self:flex-start;border:1px solid var(--line)}
.m.u{background:var(--you);align-self:flex-end}
.row{display:flex;gap:8px;margin-top:12px}
input[type=text]{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aab4be;margin-right:6px}
.dot.on{background:var(--go);animation:p 1s infinite}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
@keyframes p{50%{opacity:.35}}
#fb{display:none;white-space:pre-wrap;line-height:1.5;margin-top:16px}
.install{display:none;width:100%;margin-top:10px;background:#16202b;color:#fff}
.hint{display:none;margin-top:10px;color:var(--mute);font-size:14px;line-height:1.4}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#f6f8fa;border:1px solid var(--line);margin-bottom:8px;gap:8px}
.item small{display:block;color:var(--mute);font-weight:400}
.score{font-weight:800;font-size:18px;white-space:nowrap}
#hist{display:none}
.tr{display:flex;flex-direction:column;gap:8px;margin-top:12px}
h3{margin:16px 0 6px;font-size:16px}
.txt{white-space:pre-wrap;line-height:1.5}
.warn{background:#fff3cd;border:1px solid #e6cf85;padding:10px;border-radius:10px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<main>
  <h1>Cold Call Practice</h1>
  <p class="sub">A simulated US/Canada homeowner picks up. Speak English into your mic.</p>
  <div class="warn" id="warn">Voice input needs Google Chrome. You can still type your replies.</div>

  <section class="card" id="setup">
    <label for="persona">Who picks up?</label>
    <select id="persona">
      <option value="fsbo">FSBO owner (selling alone)</option>
      <option value="expired">Expired listing</option>
      <option value="busy">Busy, wants to hang up</option>
      <option value="hasagent">Already has an agent</option>
      <option value="hesitant">Hesitant seller</option>
      <option value="notint">"Not interested"</option>
      <option value="investor">Investor / landlord</option>
    </select>
    <label for="level">Difficulty</label>
    <select id="level">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="go" id="start">Start call</button>
    <button class="ghost" id="histOpen" style="width:100%;margin-top:10px">History</button>
    <button class="install" id="install">Install as app</button>
    <div class="hint" id="iosHint">To install on iPhone: tap Share, then "Add to Home Screen".</div>
  </section>

  <section class="card" id="call">
    <div class="bar">
      <div><div id="who"></div><div id="status"><span class="dot" id="dot"></span><span id="st">Connecting</span></div></div>
      <div id="timer">00:00</div>
    </div>
    <div id="log" aria-live="polite"></div>
    <div class="row">
      <input type="text" id="txt" placeholder="Type instead of speaking" autocomplete="off">
      <button class="ghost" id="send">Send</button>
    </div>
    <div class="row">
      <button class="ghost" id="mic">Pause mic</button>
      <button class="end" id="hang" style="margin-left:auto">End call</button>
    </div>
  </section>

  <section class="card" id="fb"></section>
  <div class="row" id="again" style="display:none">
    <button class="ghost" id="retry" style="display:none">Retry feedback</button>
    <button class="ghost" id="histOpen2">History</button>
    <button class="go" style="flex:1" onclick="location.reload()">New call</button>
  </div>

  <section class="card" id="hist">
    <div class="bar">
      <button class="ghost" id="hBack">Back</button>
      <button class="ghost" id="hClear">Clear all</button>
    </div>
    <div id="hlist"></div>
    <div id="hdet" style="display:none"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("warn").style.display = "block";

const NAMES = {fsbo:"Mike",expired:"Linda",busy:"Dave",hasagent:"Karen",hesitant:"Priya",notint:"Tom",investor:"Carlos"};
let msgs = [], persona, level, rec, micOn = true, speaking = false, busy = false, ended = false, t0, tick, voice;

function pickVoice(){
  const v = speechSynthesis.getVoices().filter(x => /en-(US|CA)/i.test(x.lang));
  voice = v.find(x => /google|natural|samantha|aria|jenny/i.test(x.name)) || v[0];
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function add(text, cls){
  const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}
function status(s, on){ $("st").textContent = s; $("dot").classList.toggle("on", !!on); }

async function api(body){
  const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j.text;
}

function speak(text, done){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice; u.rate = 1.02;
  speaking = true; status("Customer speaking", true);
  u.onend = u.onerror = () => { speaking = false; done && done(); };
  speechSynthesis.speak(u);
}

async function turn(){
  busy = true; stopRec(); status("Customer thinking");
  try {
    let text = await api({mode:"call", persona, level, messages: msgs});
    const hang = /\[HANGUP\]/i.test(text);
    text = text.replace(/\[HANGUP\]/ig, "").trim() || "Goodbye.";
    msgs.push({role:"model", text}); add(text, "c");
    busy = false;
    speak(text, () => hang ? endCall() : listen());
  } catch (e) {
    busy = false; status("Error: " + e.message); add("⚠ " + e.message, "c");
  }
}

function userSays(text){
  text = text.trim(); if (!text || busy || ended) return;
  speechSynthesis.cancel(); stopRec();
  msgs.push({role:"user", text}); add(text, "u"); turn();
}

function listen(){
  if (!SR || !micOn || ended || busy || speaking) { status(micOn ? "Your turn" : "Mic paused"); return; }
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.continuous = false;
  let got = false;
  rec.onresult = e => { got = true; userSays(e.results[0][0].transcript); };
  rec.onend = () => { if (!got && micOn && !ended && !busy && !speaking) setTimeout(listen, 200); };
  rec.onerror = e => { if (e.error === "not-allowed") { micOn = false; status("Mic blocked — type instead"); } };
  try { rec.start(); status("Listening… your turn", true); } catch {}
}
function stopRec(){ if (rec) { rec.onend = null; try { rec.abort(); } catch {} } }

$("start").onclick = () => {
  persona = $("persona").value; level = $("level").value;
  $("setup").style.display = "none"; $("call").style.display = "block";
  $("who").textContent = NAMES[persona] + " (" + $("level").selectedOptions[0].text + ")";
  t0 = Date.now();
  tick = setInterval(() => { const s = Math.floor((Date.now()-t0)/1000); $("timer").textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }, 1000);
  msgs = [{role:"user", text:"[The phone rings and you pick up. Say hello the way you naturally would.]", hidden:true}];
  turn();
};
$("send").onclick = () => { userSays($("txt").value); $("txt").value = ""; };
$("txt").onkeydown = e => { if (e.key === "Enter") $("send").click(); };
$("mic").onclick = () => {
  micOn = !micOn; $("mic").textContent = micOn ? "Pause mic" : "Resume mic";
  micOn ? listen() : (stopRec(), status("Mic paused"));
};
$("hang").onclick = endCall;

// ---- History (stored on this device only) ----
const HKEY = "cc_history_v1";
const LEVELS = {easy:"Easy", medium:"Medium", hard:"Hard"};
let curRec = null;
function loadH(){ try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch { return []; } }
function saveH(a){ try { localStorage.setItem(HKEY, JSON.stringify(a.slice(0, 50))); } catch {} }
function upsert(rec){ const a = loadH(), i = a.findIndex(x => x.id === rec.id); if (i >= 0) a[i] = rec; else a.unshift(rec); saveH(a); }
function scoreOf(t){ const m = /Score:\s*(\d+(?:\.\d+)?)\s*\/\s*10/i.exec(t || ""); return m ? m[1] + "/10" : "—"; }
function fmtDur(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function getFeedback(){
  $("retry").style.display = "none"; $("fb").textContent = "Analyzing your call…";
  try {
    const t = await api({mode:"feedback", persona: curRec.persona, level: curRec.level, messages: curRec.msgs});
    curRec.feedback = t; upsert(curRec); $("fb").textContent = t;
  } catch (e) {
    $("fb").textContent = "Couldn't get feedback: " + e.message + "\nThe call was saved to History.";
    $("retry").style.display = "";
  }
}
$("retry").onclick = getFeedback;

async function endCall(){
  if (ended) return; ended = true; stopRec(); speechSynthesis.cancel(); clearInterval(tick);
  $("call").style.display = "none"; $("fb").style.display = "block"; $("again").style.display = "flex";
  if (msgs.filter(m => !m.hidden && m.role === "user").length < 1) { $("fb").textContent = "Call ended before you said anything."; return; }
  curRec = {id: Date.now(), ts: Date.now(), persona, level, dur: Math.floor((Date.now() - t0) / 1000), msgs, feedback: null};
  upsert(curRec);
  await getFeedback();
}

function showHistory(){
  ["setup","call","fb","again"].forEach(id => $(id).style.display = "none");
  $("hist").style.display = "block"; renderList();
}
function renderList(){
  $("hdet").style.display = "none"; $("hlist").style.display = "block"; $("hClear").style.display = "";
  const box = $("hlist"); box.textContent = "";
  const a = loadH();
  if (!a.length) { box.appendChild(el("p", "sub", "No calls yet. Your finished calls will show up here.")); return; }
  a.forEach(rec => {
    const b = el("button", "item");
    const l = el("div"); l.appendChild(document.createTextNode(NAMES[rec.persona] + " · " + LEVELS[rec.level]));
    l.appendChild(el("small", "", new Date(rec.ts).toLocaleString() + " · " + fmtDur(rec.dur)));
    b.appendChild(l); b.appendChild(el("div", "score", scoreOf(rec.feedback)));
    b.onclick = () => renderDetail(rec.id);
    box.appendChild(b);
  });
}
function renderDetail(id){
  const rec = loadH().find(x => x.id === id); if (!rec) return renderList();
  $("hlist").style.display = "none"; $("hClear").style.display = "none";
  const d = $("hdet"); d.style.display = "block"; d.textContent = "";
  const back = el("button", "ghost", "← All calls"); back.onclick = renderList; d.appendChild(back);
  d.appendChild(el("h3", "", NAMES[rec.persona] + " (" + LEVELS[rec.level] + ") · " + scoreOf(rec.feedback)));
  d.appendChild(el("div", "sub", new Date(rec.ts).toLocaleString() + " · " + fmtDur(rec.dur)));
  d.appendChild(el("h3", "", "Feedback"));
  const fb = el("div", "txt", rec.feedback || "No feedback saved for this call."); d.appendChild(fb);
  if (!rec.feedback) {
    const r = el("button", "ghost", "Get feedback"); r.style.marginTop = "8px";
    r.onclick = async () => {
      fb.textContent = "Analyzing your call…"; r.disabled = true;
      try { rec.feedback = await api({mode:"feedback", persona: rec.persona, level: rec.level, messages: rec.msgs}); upsert(rec); renderDetail(rec.id); }
      catch (e) { fb.textContent = "Couldn't get feedback: " + e.message; r.disabled = false; }
    };
    d.appendChild(r);
  }
  d.appendChild(el("h3", "", "Transcript"));
  const tr = el("div", "tr");
  rec.msgs.filter(m => !m.hidden).forEach(m => tr.appendChild(el("div", "m " + (m.role === "user" ? "u" : "c"), m.text)));
  d.appendChild(tr);
  const del = el("button", "end", "Delete this call"); del.style.marginTop = "16px";
  del.onclick = () => { if (confirm("Delete this call?")) { saveH(loadH().filter(x => x.id !== rec.id)); renderList(); } };
  d.appendChild(del);
}
$("histOpen").onclick = showHistory;
$("histOpen2").onclick = showHistory;
$("hBack").onclick = () => location.reload();
$("hClear").onclick = () => { if (confirm("Delete all saved calls?")) { saveH([]); renderList(); } };

// ---- PWA: service worker + install button ----
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
let deferredPrompt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (!standalone) $("install").style.display = "block";
});
$("install").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; $("install").style.display = "none";
};
window.addEventListener("appinstalled", () => { $("install").style.display = "none"; });
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $("iosHint").style.display = "block";
</script>
</body>
</html>
